<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f16">
<title>KotoBuy</title>
<style>
:root{--acc:#1a8cff;--ok:#22b573;--bad:#ef4b5c;--warn:#f0a020;--txt:#14181f;--mut:#7b8594;--bg:#f2f3f6;--card:#fff;--line:#e6e8ee;--g:#e7eaf0;--chat:#eef1f5;--rad:15px}
#scr.dark{--txt:#eef1f6;--mut:#8b94a3;--bg:#0f1115;--card:#1b1e24;--line:#2a2e36;--g:#2a2f38;--chat:#0b0d11}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(circle at 30% 20%,#26324a,#0b0f16 70%);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);display:flex;align-items:center;justify-content:center;overflow:hidden}
#phone{position:relative;width:400px;height:min(860px,100vh - 24px);background:#000;border-radius:46px;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 2px #333}
#scr{color:var(--txt);position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
@media(max-width:500px){#phone{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}#scr{border-radius:0}}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,textarea{font:inherit;color:var(--txt)}
/* статус-бар */
.sb{height:34px;flex:0 0 auto;display:flex;align-items:center;padding:0 22px;font-size:13px;font-weight:600;z-index:3}
.sb .sp{flex:1}.sb.light{color:#fff}
.dots{display:flex;gap:3px;align-items:flex-end}.dots i{width:3px;background:currentColor;border-radius:1px}
/* рабочий стол */
.home{flex:1;display:flex;flex-direction:column;background:linear-gradient(165deg,#7fb6ff 0%,#9a8cf0 55%,#d08ad6 100%);color:#fff}
.widget{margin:8px 18px 4px;padding:14px 16px;border-radius:22px;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);display:flex;gap:14px;align-items:center}
.widget .big{font-size:34px;font-weight:300;letter-spacing:-1px}.widget small{opacity:.85;font-size:12px;display:block}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;padding:18px 14px;align-content:start;flex:1}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;text-shadow:0 1px 2px rgba(0,0,0,.3);position:relative}
.ico{width:58px;height:58px;border-radius:var(--rad);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:transform .12s}
.app:active .ico{transform:scale(.9)}
.ico svg{width:34px;height:34px}
.bdg{position:absolute;top:-5px;right:8px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ff3b30;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-shadow:none}
.dock{margin:0 12px 10px;padding:12px 10px;border-radius:28px;background:rgba(255,255,255,.25);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(4,1fr)}
.dock .app span{display:none}
.hbar{height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4}
.hbar i{width:130px;height:5px;border-radius:3px;background:var(--txt);opacity:.8}.home+.hbar i,.hbar.light i{background:#fff}
/* приложения */
.appv{flex:1;display:flex;flex-direction:column;min-height:0}.appv.anim{animation:apin .22s ease-out}
@keyframes apin{from{transform:scale(.94);opacity:0}}
.nav{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.nav h2{font-size:18px;flex:1;text-align:center;margin-right:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{color:var(--acc);font-size:16px;padding:4px 6px;min-width:50px;text-align:left}
.body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.lst{background:var(--card);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border:0}.li .t{flex:1;min-width:0}.li .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#b8bec9;font-size:20px}
.mut{color:var(--mut);font-size:13px}.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:11px 14px;font-weight:600;text-align:center}
.btn.g{background:var(--g);color:var(--txt)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}.btn.w{width:100%}
.btn.s{padding:7px 11px;font-size:13px;border-radius:10px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none}
.inp:focus{border-color:var(--acc)}
.price{font-size:20px;font-weight:800}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--g);color:var(--mut);margin:1px 0}
.tag.bad{background:#fde8ea;color:var(--bad)}.tag.ok{background:#e3f6ee;color:#159a5f}.tag.warn{background:#fdf1dc;color:#b87400}.tag.acc{background:#e3f0ff;color:var(--acc)}
.ad{display:flex;gap:10px;background:var(--card);border-radius:16px;padding:8px;text-align:left;width:100%}
.ad .ph{width:128px;flex:0 0 128px;height:84px;border-radius:11px;background:linear-gradient(180deg,#cfe0f3,#eef3f9 70%,#d6d9de 70%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ad .ph svg{width:118px}.ad .in{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hero{border-radius:16px;background:linear-gradient(180deg,#bcd6f2,#e9f0f8 68%,#c9ccd2 68%,#b9bdc4);display:flex;justify-content:center;padding:18px 8px 6px}
.hero svg{width:100%;max-width:330px}
.seg{display:flex;background:var(--g);border-radius:10px;padding:2px;margin:0 12px 0}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sys{display:grid;grid-template-columns:86px 1fr 40px;gap:7px 8px;align-items:center;font-size:13px}
.bar{height:7px;border-radius:4px;background:var(--g);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
/* чат */
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--chat)}
.m{max-width:80%;padding:8px 12px;border-radius:18px;font-size:14px;background:var(--card);align-self:flex-start;border-bottom-left-radius:5px}
.m.me{align-self:flex-end;background:var(--acc);color:#fff;border-radius:18px;border-bottom-right-radius:5px}
.m.sys{align-self:center;background:transparent;color:var(--mut);font-size:12px;text-align:center}
.m small{display:block;font-size:10px;opacity:.6;text-align:right}
.qr{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);border-top:1px solid var(--line)}
.qr button{white-space:nowrap;padding:7px 12px;border-radius:16px;background:#e9f2ff;color:var(--acc);font-size:13px;font-weight:600}
.qr button:disabled{opacity:.4}
.cin{display:flex;gap:8px;padding:8px 10px 10px;background:var(--card)}
.av{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
/* старт */
.start{flex:1;display:flex;flex-direction:column;background:var(--acc);min-height:0}
.start .hd{padding:26px 22px 22px;color:#fff;text-align:center}
.start h1{font-size:24px;margin-bottom:8px}
.start .hd .inp{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff;margin-top:14px}
.start .hd .inp::placeholder{color:rgba(255,255,255,.7)}
.start .ls{flex:1;background:#fff;border-radius:26px 26px 0 0;padding:14px 12px 0;display:flex;flex-direction:column;min-height:0}
.cities{flex:1;overflow-y:auto;margin-top:8px}
.ci{width:28px;height:28px;border-radius:50%;background:#e3f0ff;display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:14px;right:14px;top:44px;background:rgba(30,34,42,.95);color:#fff;padding:12px 14px;border-radius:16px;z-index:10;font-size:14px;animation:tin .25s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast b{display:block;font-size:12px;opacity:.7;margin-bottom:2px}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi .card b{display:block;font-size:18px}
.bank{background:linear-gradient(135deg,#ff8a00,#ff5e3a);color:#fff;border-radius:20px;padding:18px}
.bank .price{font-size:28px}
.sleep{flex:1;background:linear-gradient(180deg,#0d1530,#1d2752);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
.wps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wp{aspect-ratio:9/16;border-radius:14px;position:relative;border:3px solid transparent;color:#fff;font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding:6px;text-shadow:0 1px 2px #000}.wp.on{border-color:var(--acc)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);position:relative}.sw.on{border-color:var(--acc)}
.bk{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:var(--g);padding:6px;border-radius:14px;touch-action:manipulation}.bk i{aspect-ratio:1;border-radius:5px;background:var(--card);display:block}
.pcs{display:flex;gap:10px;justify-content:space-around;align-items:center;min-height:130px}.pc{display:grid;gap:2px;padding:8px;border-radius:12px;border:2px solid transparent}.pc{touch-action:none;cursor:grab;transition:opacity .15s}.pc.drag{opacity:.15}.pcs{touch-action:none}
.ghost{position:absolute;z-index:20;display:grid;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}.ghost i{border-radius:5px;display:block}
.bk i.pv{opacity:.5}.bk i.fl{animation:fl .35s}@keyframes fl{0%{transform:scale(1);filter:brightness(2)}100%{transform:scale(.2);opacity:0}}.pc i{width:22px;height:22px;border-radius:4px;display:block}
textarea.inp{min-height:140px;resize:vertical}
</style>
</head>
<body>
<div id="phone"><div id="scr"></div></div>
<script>
'use strict';
/* ===================== ДАННЫЕ ===================== */
// id, название, кузов, цена нового, год от, год до, надёжность, стоимость запчастей, спрос, японка
const MODELS=[
 ['zh07','Жигулёв 07','classic',700000,1995,2012,.45,.35,.75,0],
 ['lpr','Ладога Приора','sedan',1050000,2008,2018,.55,.45,.85,0],
 ['lgr','Ладога Гранда','sedan',1300000,2012,2025,.6,.45,.9,0],
 ['niv','Нива 4х4','suv',1250000,2000,2025,.5,.45,.8,0],
 ['vlg','Волгарь 3110','sedan',900000,1997,2009,.4,.5,.4,0],
 ['sol','Хендо Солярис','sedan',1700000,2011,2022,.8,.75,.95,0],
 ['rio','Кио Рио','hatch',1650000,2011,2022,.8,.75,.9,0],
 ['pol','Фольк Поло','sedan',1800000,2010,2020,.72,.85,.8,0],
 ['foc','Форт Фокус','hatch',1600000,2005,2019,.65,.75,.7,0],
 ['cam','Тойко Камро','sedan',3800000,2006,2024,.9,1.1,.85,1],
 ['crl','Тойко Корола','sedan',2400000,2006,2023,.92,.9,.85,1],
 ['bm3','Бэмка Тройка','sedan',4200000,2005,2022,.6,1.6,.7,0],
 ['mrc','Мерсо Е-класс','sedan',6000000,2005,2022,.62,1.8,.6,0],
 ['rav','Тойко Рав','suv',3600000,2008,2024,.88,1.05,.85,1],
 ['ftt','Ниссо Фит','hatch',1500000,2005,2020,.88,.7,.7,1],
 ['duo','Дастор','suv',1900000,2012,2025,.7,.6,.85,0],
 ['gaz','Газелька','van',2300000,2005,2025,.45,.5,.6,0],
];
const COLORS=[['Белый','#eef1f4'],['Чёрный','#22252b'],['Серебристый','#b9c1c9'],['Серый','#6f7782'],['Синий','#2f5fa8'],['Красный','#c0342c'],['Зелёный','#2f7a4a'],['Бежевый','#cbb38a'],['Вишнёвый','#6e1f2c'],['Жёлтый','#e3b22e']];
const SYS=[['engine','Двигатель',1.0],['trans','Коробка',.7],['susp','Подвеска',.35],['body','Кузов',.6],['inter','Салон',.25],['elec','Электрика',.3]];
const NAMES=['Андрей','Сергей','Ольга','Михаил','Дмитрий','Наталья','Игорь','Виктор','Елена','Алексей','Рустам','Павел','Ирина','Артём','Владимир','Тимур','Галина','Олег','Анна','Руслан'];
const AVC=['#ff7a59','#29b6f6','#7e57c2','#26a69a','#ec407a','#8d6e63','#5c6bc0','#ffa726'];
// город, широта, долгота, размер 1..5
const CITIES=[['Москва',55.75,37.62,5],['Санкт-Петербург',59.94,30.31,5],['Новосибирск',55.03,82.92,4],['Екатеринбург',56.84,60.6,4],['Казань',55.79,49.12,4],['Нижний Новгород',56.33,44,4],['Челябинск',55.16,61.4,4],['Самара',53.2,50.15,4],['Омск',54.99,73.37,4],['Ростов-на-Дону',47.23,39.7,4],['Уфа',54.73,55.96,4],['Красноярск',56.01,92.85,4],['Воронеж',51.67,39.18,4],['Пермь',58.01,56.25,4],['Волгоград',48.71,44.51,4],['Краснодар',45.04,38.98,4],['Саратов',51.53,46.03,3],['Тюмень',57.15,65.53,3],['Тольятти',53.51,49.42,3],['Ижевск',56.85,53.2,3],['Барнаул',53.35,83.78,3],['Ульяновск',54.31,48.4,3],['Иркутск',52.29,104.3,3],['Хабаровск',48.48,135.08,3],['Ярославль',57.63,39.87,3],['Владивосток',43.12,131.89,3],['Махачкала',42.98,47.5,3],['Томск',56.48,84.95,3],['Оренбург',51.77,55.1,3],['Кемерово',55.35,86.09,3],['Рязань',54.63,39.74,3],['Астрахань',46.35,48.04,3],['Пенза',53.2,45,3],['Липецк',52.61,39.6,3],['Тула',54.19,37.62,3],['Киров',58.6,49.66,3],['Калининград',54.71,20.51,3],['Курск',51.73,36.19,3],['Сочи',43.6,39.73,3],['Тверь',56.86,35.9,3],['Белгород',50.6,36.6,3],['Балашиха',55.8,37.94,3],['Архангельск',64.54,40.54,2],['Мурманск',68.97,33.07,2],['Абакан',53.72,91.44,2],['Армавир',44.99,41.12,2],['Арзамас',55.39,43.84,1],['Псков',57.82,28.33,2],['Смоленск',54.78,32.04,2],['Кострома',57.77,40.93,2],['Владимир',56.13,40.4,2],['Калуга',54.51,36.26,2],['Ачинск',56.27,90.5,1],['Апатиты',67.57,33.4,1],['Анадырь',64.73,177.5,1],['Якутск',62.03,129.73,2]].sort((a,b)=>a[0].localeCompare(b[0],'ru'));
const NOAIR=['Балашиха','Армавир','Тольятти','Арзамас','Ачинск','Апатиты','Тула','Тверь','Владимир','Кострома'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

/* ===================== УТИЛИТЫ ===================== */
const $=s=>document.querySelector(s);
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rub=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('ru-RU')+' ₽';
const km=n=>Math.round(n).toLocaleString('ru-RU')+' км';
const round=(v,s=1000)=>Math.round(v/s)*s;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return (h>>>0)/4294967296};
const C=n=>CITIES.find(c=>c[0]===n);
const M=id=>MODELS.find(m=>m[0]===id);
function dist(a,b){a=C(a);b=C(b);const r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[2]-a[2])*r;const x=Math.sin(dl/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dn/2)**2;return Math.round(6371*2*Math.asin(Math.sqrt(x))*1.25)}
const hh=t=>{t=((t%24)+24)%24;const h=Math.floor(t),m=Math.floor((t-h)*60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')};
const durS=h=>h<1?Math.round(h*60)+' мин':h<48?(Math.floor(h)+' ч'+(h%1>.05?' '+Math.round(h%1*60)+' мин':'')):Math.round(h/24)+' дн';
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
let uid=Date.now()%1e6;const nid=p=>p+(uid++).toString(36);

/* ===================== СОСТОЯНИЕ ===================== */
let S=null,ui={scr:'home'};
const day=()=>Math.floor(S.t/24)+1,hour=()=>S.t%24;
function newGame(name,city){
 S={v:2,ph:defPh(),props:[],re:{},bk:{best:0,day:0,earned:0},name,city,home:city,t:9,money:150000,rep:50,slots:1,cars:[],mk:{},chats:[],ads:[],bank:[],loan:null,tools:{},notes:'',log:[],stats:{bought:0,sold:0,profit:0},drift:{}};
 MODELS.forEach(m=>S.drift[m[0]]=1);
 // стартовая машина: старая классика
 const c=genCar('zh07');c.paid=60000;c.city=city;c.known=allKnown();c.cond.body=Math.max(c.cond.body,45);S.cars.push(c);
 money(0,'Стартовый капитал 150 000 ₽');
 logx('Начал путь перекупа в городе '+city+'. Есть 150 000 ₽ и старый Жигулёв.');
 sysChat('Банк','#ff6a2a','Добро пожаловать! На карте 150 000 ₽. Нужен оборотный капитал? Загляните в приложение Банк.');
}
const allKnown=()=>({look:1,base:1,paint:1,diag:1});
function save(){try{localStorage.setItem('perekup_v2',JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('perekup_v2'));if(s&&s.v===2){S=s;return true}}catch(e){}return false}
function money(v,desc){S.money+=v;if(v)S.bank.unshift([day(),hh(S.t),v,desc]);if(S.bank.length>120)S.bank.length=120}
function logx(t){S.log.unshift('День '+day()+', '+hh(S.t)+'. '+t);if(S.log.length>100)S.log.length=100}

/* ===================== МАШИНЫ И ЦЕНЫ ===================== */
function genCar(mid){
 const m=mid?M(mid):pick(MODELS),[id,,,,y0,y1,rel]=m;
 const year=rint(y0,Math.min(y1,2026)),age=2026-year;
 const realKm=Math.max(3000,age*rnd(9000,24000)*(R()<.1?1.6:1));
 const wear=clamp(realKm/300000,0,1),cond={};
 SYS.forEach(([k])=>{let b=100-wear*rnd(30,75)-(1-rel)*rnd(0,35)-age*rnd(0,1.4);if(R()<.12)b-=rnd(20,50);cond[k]=Math.round(clamp(b,5,100))});
 const f={};
 if(R()<.18&&age>3)f.twisted=Math.round(realKm*rnd(.35,.65));
 if(R()<.22)f.accident=R()<.35?'heavy':'light';
 if(R()<.05)f.flood=1;
 if(R()<.07)f.pledge=1;
 if(R()<.04)f.ban=1;
 if(f.accident==='heavy')cond.body=Math.min(cond.body,rint(25,60));
 if(f.flood){cond.elec=Math.min(cond.elec,rint(10,40));cond.inter=Math.min(cond.inter,rint(20,50))}
 const owners=clamp(Math.round(age/rnd(2,5))+(R()<.3?2:0),1,9);
 return {id:nid('c'),model:m[0],year,color:pick(COLORS),realKm:Math.round(realKm),shownKm:f.twisted||Math.round(realKm),cond,flags:f,owners,known:{},clean:0,paid:0,invest:0,city:null,busy:0};
}
const avgCond=c=>{let s=0,w=0;SYS.forEach(([k,,x])=>{s+=c.cond[k]*x;w+=x});return s/w};
function cityMult(city,mid){
 const c=C(city),m=M(mid);
 let k=1+(c[3]-3)*.025+(hash(city+mid)-.5)*.14;
 if(m[9]&&c[2]>100)k*=.86;           // японки дешевле на Дальнем Востоке
 if(c[2]>100&&!m[9])k*=1.08;          // остальное там дороже
 return k*S.drift[mid];
}
function value(c,city,opt={}){
 const m=M(c.model),age=2026-c.year;
 let v=m[3]*(.18+.82*Math.pow(.86,age))*cityMult(city||c.city||S.city,c.model);
 v*=clamp(1-(opt.km||c.realKm)/700000,.35,1);
 v*=.45+.55*Math.pow(avgCond(c)/100,1.2);
 const f=opt.flags||c.flags;
 if(f.accident==='heavy')v*=.78;else if(f.accident==='light')v*=.93;
 if(f.flood)v*=.6;if(f.twisted)v*=.9;if(f.pledge)v*=.55;if(f.ban)v*=.6;
 if(c.owners>4)v*=.95;if(c.clean)v*=1.03;
 return Math.max(25000,round(v));
}

 const c=genCar(),type=R()<.6?'private':R()<.65?'dealer':'salon';
 const honest=type==='private'?rnd(.35,1):type==='dealer'?rnd(.05,.55):rnd(.5,.9);

 const min=Math.min(ask,round(Math.max(value(c,city)*rnd(.72,.95),ask*rnd(.74,.92))));
 const cl=[];
 if(c.flags.accident&&honest>.7)cl.push('Был небольшой ремонт кузова');else cl.push(pick(['Не бита, не крашена','Кузов в родной краске','Без ДТП']));

 if(c.owners<=2)cl.push(c.owners===1?'Один хозяин':'Два владельца');

 return {lid:nid('l'),car:c,type,name:pick(NAMES),av:pick(AVC),honest,ask,min,pat:rint(2,4),exp:S.t+rint(3,10)*24,claims:cl,agreed:0,meet:0,disc:0};
}

function advance(h){
 const d0=day();S.t+=h;

}
function dayTick(d){
 // рынок
 for(const k in S.mk){const it=S.mk[k].items;S.mk[k].items=it.filter(L=>L.exp>S.t&&(L.meet||R()>.07));
  const n=4+C(k)[3]*3,add=rint(1,3);for(let i=0;i<add&&S.mk[k].items.length<n+3;i++)S.mk[k].items.push(genListing(k))}
 MODELS.forEach(m=>S.drift[m[0]]=clamp(S.drift[m[0]]*(1+rnd(-.012,.012)),.88,1.12));
 // стоянки и двор
 let park=0;
 S.cars.forEach(c=>{const w=where(c);if(w.startsWith('стоянка'))park+=300;
  else if(w==='во дворе'&&R()<.05){c.cond.body=Math.max(5,c.cond.body-rint(3,10));note('Двор','#607d8b','Кто-то поцарапал '+M(c.model)[1]+' во дворе. Кузов пострадал.')}});
 if(park)money(-park,'Платные стоянки');
 // покупатели
 S.ads.forEach(a=>{const c=S.cars.find(x=>x.id===a.cid);if(!c)return;
  const base=a.honest?value(c):apparent(c),dem=M(c.model)[8],ratio=a.price/base;
  const ch=clamp(dem*(1.65-ratio)*(.6+S.rep/120),.02,.92);
  const tries=1+(C(c.city)[3]>=4?1:0);
  for(let i=0;i<tries;i++)if(R()<ch){
   const off=round(Math.min(a.price,base*rnd(.82,1.02)),5000);
   const name=pick(NAMES);
   const ch2={id:nid('h'),kind:'buyer',cid:c.id,name,av:pick(AVC),msgs:[],unread:1,offer:off,flex:rnd(.3,.8),exp:S.t+rint(2,4)*24,city:c.city};
   ch2.msgs.push(['they',pick(['Здравствуйте, машина ещё продаётся?','Добрый день! Интересует ваш автомобиль.','Привет, актуально?'])+' '+pick(['Готов взять за ','Могу предложить ','Наличными сразу ',''])+rub(off)+(R()<.5?'. Когда можно посмотреть?':'.'),S.t]);
   S.chats.unshift(ch2);
  }});
 S.chats.forEach(ch=>{if(ch.kind==='buyer'&&!ch.done&&ch.exp<S.t){ch.done=1;ch.msgs.push(['sys','Покупатель нашёл другой вариант',S.t])}});
 // кредит
 const L=S.loan;
 if(L&&d>=L.next){
  if(S.money>=L.pay){money(-L.pay,'Платёж по кредиту');L.left-=L.pay;L.next+=7;note('Банк','#ff6a2a','Списан платёж по кредиту '+rub(L.pay)+'. Осталось '+rub(Math.max(0,L.left))+'.')}
  else{L.miss++;const fine=round(L.pay*.1,100);L.left+=fine;L.next+=7;S.rep=clamp(S.rep-4,0,100);note('Банк','#ff6a2a','Не хватило денег на платёж. Штраф '+rub(fine)+'. Просрочек: '+L.miss+'.');
   if(L.miss>=3)collectors()}
  if(L.left<=0){S.loan=null;S.rep=clamp(S.rep+3,0,100);note('Банк','#ff6a2a','Кредит полностью погашен. Спасибо!')}
 }
 propTick(d);
 if(d%7===0&&S.slots>1){const r=(S.slots-1)*5000;money(-r,'Аренда гаража');}
}
function collectors(){
 const c=S.cars.filter(x=>!x.busy||x.busy<S.t).sort((a,b)=>value(a)-value(b))[0];
 if(c){const v=round(value(c)*.6);S.cars=S.cars.filter(x=>x!==c);S.ads=S.ads.filter(a=>a.cid!==c.id);S.loan.left-=v;S.loan.miss=0;

 else{S.rep=clamp(S.rep-15,0,100);note('Коллекторы','#37474f','Звонят каждый день. Репутация падает.')}

}

function fix(id,s,self){
 const c=S.cars.find(x=>x.id===id),cost=repCost(c,s,self);if(S.money<cost)return toast('Не хватает денег');
 money(-cost,(self?'Запчасти: ':'СТО: ')+SYS.find(x=>x[0]===s)[1].toLowerCase());c.invest+=cost;
 const d=self?rint(2,4):rint(1,2);c.busy=Math.max(c.busy,S.t)+d*24;
 let to=self?(R()<.2?c.cond[s]+rint(5,20):rint(82,94)):rint(90,98);
 if(self&&to<90&&to-c.cond[s]<25)toast('С первого раза не всё получилось');
 c.cond[s]=clamp(Math.max(to,c.cond[s]),0,100);if(s==='elec'&&!self)c.flags.flood=0;
 if(s==='body'&&!self&&c.flags.accident==='light')c.flags.accident=0;
 logx('Ремонт '+M(c.model)[1]+': '+SYS.find(x=>x[0]===s)[1].toLowerCase()+', '+rub(cost)+'.');ui._keep=1;render();
}

function routes(to){
 const d=dist(S.city,to),c1=C(S.city),c2=C(to),r=[];
 if(d<=250)r.push(['taxi','Такси',d/60+.3,round(250+d*28,50)]);
 r.push(['bus','Автобус',d/55+.5,round(300+d*2.2,50)]);
 if(d>=150&&c1[3]>=2&&c2[3]>=2)r.push(['train','Поезд',d/75+1,round(600+d*3.2,50)]);
 if(d>=500&&!NOAIR.includes(S.city)&&!NOAIR.includes(to))r.push(['plane','Самолёт',d/750+3.5,round(3500+d*5.5,100)]);
 S.cars.filter(c=>c.city===S.city&&!(c.busy>S.t)&&!c.flags.ban&&!c.flags.pledge).forEach(c=>{
  const ok=c.cond.engine>25&&c.cond.trans>25&&c.cond.susp>15;
  r.push(['car:'+c.id,'Своим ходом: '+M(c.model)[1]+(ok?'':' (не доедет)'),d/80,round(d*.09*62,50),ok])});
 return r;
}

 if(ui.sub&&ui.sub.startsWith('to:')){const to=ui.sub.slice(3);
  return nav(to,'list')+`<div class="body"><div class="card"><b>${S.city} → ${to}</b><div class="mut">${dist(S.city,to)} км по дороге</div></div>
  <div class="lst">${routes(to).map(r=>`<button class="li" data-a="go" data-x="${to}" data-y="${r[0]}" ${r[4]===false?'disabled style="opacity:.45"':''}><div class="t"><b>${r[1]}</b><span class="mut small">В пути ${durS(r[2])} · прибытие ${WD[Math.floor((S.t+r[2])/24)%7]} ${hh(S.t+r[2])}</span></div><b>${rub(r[3])}</b></button>`).join('')}</div>
  <div class="mut small">Своим ходом: бензин, износ подвески и мотора, но машина приедет с тобой и не нужна стоянка.</div></div>`}

function go(to,how){
 const r=routes(to).find(x=>x[0]===how);if(!r)return;if(S.money<r[3])return toast('Не хватает денег на дорогу');
 money(-r[3],r[1].split(':')[0]+': '+S.city+' → '+to);
 if(how.startsWith('car:')){const c=S.cars.find(x=>x.id===how.slice(4));const d=dist(S.city,to);
  c.city=to;c.realKm+=d;c.shownKm+=d;c.cond.susp=Math.max(5,c.cond.susp-Math.round(d/400));c.cond.engine=Math.max(5,c.cond.engine-Math.round(d/700));

 const from=S.city;S.city=to;advance(r[2]);
 logx('Переехал '+from+' → '+to+' ('+r[1]+').');ui.sc=to;ui.sub=null;ui.app='avito';
 toast('Ты в городе '+to+'. Время '+hh(S.t));render();
}

function bkNew(){bk={g:Array(64).fill(0),pcs:[],sel:-1,score:0,moves:0,over:0};bkDeal()}

const bkFits=(s,x,y)=>s.every(([dx,dy])=>x+dx<8&&y+dy<8&&!bk.g[(y+dy)*8+x+dx]);
const bkAny=()=>bk.pcs.some(p=>p&&Array.from({length:64},(_,i)=>i).some(i=>bkFits(p.s,i%8,i/8|0)));
function vBlocks(){
 if(S.bk.day!==day()){S.bk.day=day();S.bk.earned=0}
 if(!bk)bkNew();
 const left=BK_CAP-S.bk.earned;
 return nav('KotoBlocks')+`<div class="body"><div class="row"><div><span class="mut small">Очки</span><div class="price">${bk.score}</div></div><span class="sp"></span><div style="text-align:right"><span class="mut small">Рекорд</span><div><b>${S.bk.best}</b></div></div></div>
 <div class="bk">${bk.g.map((v,i)=>`<i style="${v?'background:'+v:''}"></i>`).join('')}</div>
 <div class="pcs">${bk.pcs.map((p,j)=>{if(!p)return '<div style="width:60px"></div>';const w=Math.max(...p.s.map(a=>a[0]))+1,h=Math.max(...p.s.map(a=>a[1]))+1;
  return `<div class="pc" data-pc="${j}" style="grid-template-columns:repeat(${w},22px)">${Array.from({length:w*h},(_,k)=>`<i style="background:${p.s.some(a=>a[0]===k%w&&a[1]===(k/w|0))?p.c:'transparent'}"></i>`).join('')}</div>`}).join('')}</div>
 ${bk.over?`<div class="card" style="text-align:center"><b>Ходов больше нет</b><div class="mut small">Заработано ${rub(bk.paid||0)}</div><button class="btn w" style="margin-top:8px" data-a="bkrestart">Ещё раз</button></div>`:
 `<div class="mut small" style="text-align:center">Перетаскивай фигуры на поле. Собирай полные ряды и столбцы.</div>`}
 <div class="mut small" style="text-align:center">Платят 2 ₽ за очко в конце игры. Сегодня можно заработать ещё ${rub(Math.max(0,left))}. Каждый ход занимает минуту игрового времени.</div></div>`}
function bkPlace(j,x,y){
 const p=bk.pcs[j];if(bk.over||!p||!bkFits(p.s,x,y))return false;
 p.s.forEach(([dx,dy])=>bk.g[(y+dy)*8+x+dx]=p.c);bk.score+=p.s.length;bk.moves++;bk.pcs[j]=null;
 const rows=[],cols=[];for(let k=0;k<8;k++){if([...Array(8)].every((_,j)=>bk.g[k*8+j]))rows.push(k);if([...Array(8)].every((_,j)=>bk.g[j*8+k]))cols.push(k)}
 const clr=new Set();rows.forEach(r=>{for(let j=0;j<8;j++)clr.add(r*8+j)});cols.forEach(c=>{for(let j=0;j<8;j++)clr.add(j*8+c)});
 const was=bk.g.slice();clr.forEach(k=>bk.g[k]=0);
 const n=rows.length+cols.length;if(n)bk.score+=n*10*n;
 if(bk.pcs.every(q=>!q))bkDeal();
 if(!bkAny()){bk.over=1;const pay=Math.max(0,Math.min(bk.score*2,BK_CAP-S.bk.earned));S.bk.earned+=pay;bk.paid=pay;if(pay)money(pay,'KotoBlocks');
  S.bk.best=Math.max(S.bk.best,bk.score);advance(bk.moves/60)}
 ui._keep=1;render();
 if(clr.size){const cells=document.querySelectorAll('.bk i');clr.forEach(k=>{const el=cells[k];el.style.background=was[k];el.classList.add('fl');setTimeout(()=>{el.classList.remove('fl');el.style.background=''},350)})}
 return true;
}

 e.preventDefault();const cells=document.querySelectorAll('.bk i'),r0=cells[0].getBoundingClientRect(),r1=cells[1].getBoundingClientRect();
 const cs=r0.width,step=r1.left-r0.left,w=Math.max(...p.s.map(a=>a[0]))+1,h=Math.max(...p.s.map(a=>a[1]))+1;
 const g=document.createElement('div');g.className='ghost';g.style.gridTemplateColumns=`repeat(${w},${cs}px)`;g.style.gap=(step-cs)+'px';

 $('#scr').appendChild(g);pc.classList.add('drag');
 drag={j,p,g,pc,cells,cs,step,w,h,x:-9,y:-9};dragMove(e);

function dragMove(e){if(!drag)return;const d=drag,sr=$('#scr').getBoundingClientRect(),r0=d.cells[0].getBoundingClientRect();
 // фигура над пальцем, чтобы её было видно

 d.g.style.left=(gx-sr.left)+'px';d.g.style.top=(gy-sr.top)+'px';

}
